[package]
name = "oh-my-harness"
version = "0.1.4"
edition = "2024"
description = "Rust Version of oh-my-harness"
license-file = "LICENSE"
repository = "https://github.com/sheltonsuen/oh-my-harness"

[[bin]]
name = "omh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.2"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
rand = "0.8"
